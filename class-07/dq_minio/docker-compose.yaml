version: "3.9"
services:
  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    container_name: minio
    ports:
    - "9000:9000" # S3 API
    - "9001:9001" # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
    - ./minio-data:/data